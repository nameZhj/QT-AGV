<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- 主背景渐变：深蓝到青蓝，体现科技感 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1e4080"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <!-- AGV车身渐变 -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <!-- 高光 -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 圆角矩形背景 -->
  <rect x="8" y="8" width="240" height="240" rx="48" ry="48" fill="url(#bgGrad)"/>

  <!-- 内部高光圆角矩形 -->
  <rect x="8" y="8" width="240" height="120" rx="48" ry="48" fill="url(#highlight)"/>

  <!-- 网格地图背景线条（暗示地图导航） -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" fill="none">
    <line x1="40" y1="60" x2="216" y2="60"/>
    <line x1="40" y1="100" x2="216" y2="100"/>
    <line x1="40" y1="180" x2="216" y2="180"/>
    <line x1="80" y1="40" x2="80" y2="216"/>
    <line x1="128" y1="40" x2="128" y2="216"/>
    <line x1="176" y1="40" x2="176" y2="216"/>
  </g>

  <!-- 导航路径（虚线） -->
  <path d="M 48 168 Q 100 168 100 128 T 180 88 L 208 88"
        stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 4"
        fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- 目标点（终点） -->
  <circle cx="208" cy="88" r="6" fill="#fbbf24" opacity="0.95"/>
  <circle cx="208" cy="88" r="10" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>

  <!-- AGV 小车主体 -->
  <g filter="url(#shadow)">
    <!-- 车身底盘 -->
    <rect x="56" y="140" width="96" height="56" rx="10" ry="10" fill="url(#bodyGrad)"/>
    <!-- 车身上部（载货平台） -->
    <rect x="68" y="124" width="72" height="22" rx="4" ry="4" fill="#bae6fd"/>
    <!-- 车身中线 -->
    <line x1="56" y1="168" x2="152" y2="168" stroke="#0c4a6e" stroke-width="1" opacity="0.4"/>
    <!-- 前方指示灯 -->
    <rect x="146" y="148" width="6" height="12" rx="2" fill="#22c55e"/>
    <!-- 顶部传感器（激光雷达） -->
    <circle cx="104" cy="118" r="8" fill="#1e3a8a"/>
    <circle cx="104" cy="118" r="4" fill="#60a5fa"/>
    <circle cx="104" cy="118" r="2" fill="#ffffff"/>

    <!-- 车轮 -->
    <rect x="62" y="194" width="20" height="10" rx="3" fill="#0f172a"/>
    <rect x="126" y="194" width="20" height="10" rx="3" fill="#0f172a"/>
  </g>

  <!-- 顶部品牌字母 "A" (AGV) -->
  <text x="128" y="72" font-family="Segoe UI, Microsoft YaHei, sans-serif"
        font-size="36" font-weight="700" fill="#ffffff"
        text-anchor="middle" opacity="0.95">AGV</text>

  <!-- 底部装饰条 -->
  <rect x="56" y="220" width="144" height="3" rx="1.5" fill="#fbbf24" opacity="0.7"/>
</svg>
